<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OSM Drive">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <title>OSM Drive — Conduce por tu ciudad</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>
    <canvas id="overlay"></canvas>

    <div id="hud">
        <div class="hud-left">
            <div class="speedo">
                <div class="speed-value"><span id="speed">0</span><span class="speed-unit">km/h</span></div>
                <div class="gear">Marcha: <span id="gear">N</span></div>
            </div>
        </div>
        <div class="hud-right">
            <div id="status" class="status"></div>
            <div id="coords" class="coords"></div>
        </div>
    </div>

    <div id="warning" class="warning hidden">¡Fuera de carretera!</div>

    <div id="loader" class="loader">
        <div class="loader-card">
            <h1>OSM Drive</h1>
            <p id="loader-msg">Pidiendo tu ubicación…</p>
            <div class="controls-help">
                <h3>Controles</h3>
                <ul>
                    <li><b>W / ↑</b> Acelerar</li>
                    <li><b>S / ↓</b> Frenar / marcha atrás</li>
                    <li><b>A D / ← →</b> Girar</li>
                    <li><b>Espacio</b> Freno de mano</li>
                    <li><b>R</b> Reiniciar posición</li>
                </ul>
                <p class="tap-hint">En móvil: toca los botones en pantalla.</p>
            </div>
            <button id="start-btn" disabled>Cargando…</button>
            <button id="fallback-btn" class="secondary">Empezar en Madrid</button>
        </div>
    </div>

    <div id="touch-controls" class="touch-controls hidden">
        <div class="touch-left">
            <button class="touch-btn" data-key="ArrowLeft">◀</button>
            <button class="touch-btn" data-key="ArrowRight">▶</button>
        </div>
        <div class="touch-right">
            <button class="touch-btn" data-key="ArrowUp">▲</button>
            <button class="touch-btn" data-key="ArrowDown">▼</button>
            <button class="touch-btn brake" data-key="Space">P</button>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
